# Builds the plugin and publishes a GitHub Release with the DLL attached.
#
# Runs on its own when a push to main changes <Version> in the project file
# (no release yet for that version), or by hand: Actions -> Release -> Run workflow.
name: Release

on:
  push:
    branches: [main]
    paths: [EmbyCollections.csproj, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT: EmbyCollections.csproj
  DLL: EmbyCollections.dll
  # Emby release whose DLLs the plugin is compiled against (the server supplies them at runtime).
  EMBY_VERSION: 4.11.0.11

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' "$PROJECT")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-dotnet@v4
        if: steps.version.outputs.skip != 'true'
        with:
          dotnet-version: 8.0.x

      - name: Build against Emby
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The pinned Emby release first. Emby removes old beta packages, so if it's gone,
          # try the newest stable release and then the newest beta.
          candidates="$EMBY_VERSION"
          list=$(gh api "repos/MediaBrowser/Emby.Releases/releases?per_page=40" \
            --jq '[.[] | select(any(.assets[]?; .name | test("^emby-server-deb_.*_amd64\\.deb$")))]
                  | ((map(select(.prerelease | not)) | .[0].tag_name), (map(select(.prerelease)) | .[0].tag_name))
                  | select(. != null)' || true)
          candidates="$candidates $list"
          for v in $candidates; do
            echo "::group::Emby $v"
            rm -rf emby.deb emby-pkg emby-lib out
            if curl -fsSL -o emby.deb "https://github.com/MediaBrowser/Emby.Releases/releases/download/$v/emby-server-deb_${v}_amd64.deb" \
               && dpkg-deb -x emby.deb emby-pkg \
               && mkdir -p emby-lib \
               && cp emby-pkg/opt/emby-server/system/{MediaBrowser.Common,MediaBrowser.Controller,MediaBrowser.Model,SkiaSharp}.dll emby-lib/ \
               && dotnet build "$PROJECT" -c Release -o out -p:EmbyLibDir="$PWD/emby-lib"; then
              echo "::endgroup::"
              [ "$v" = "$EMBY_VERSION" ] || echo "::warning::Emby $EMBY_VERSION is no longer published; built against Emby $v instead. Update EMBY_VERSION in this workflow."
              echo "BUILT_EMBY=$v" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::endgroup::"
            echo "Emby $v didn't work, trying the next one"
          done
          echo "::error::Couldn't build against any Emby release ($candidates)"
          exit 1

      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        run: |
          v="v${{ steps.version.outputs.version }}"
          gh release create "$v" "out/$DLL" \
            --target "$GITHUB_SHA" \
            --title "Emby Collections ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --notes "Copy \`$DLL\` into Emby's \`plugins\` folder and restart Emby. Built against Emby ${BUILT_EMBY:-$EMBY_VERSION}; needs Emby 4.10 or newer."
        env:
          GH_TOKEN: ${{ github.token }}
